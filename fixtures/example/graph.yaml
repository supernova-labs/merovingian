# Synthetic example tenant; no real tenant data.
namespace: acme
ambient:
  skills:
    - journal
  instructions: Respect the authenticated identity and purpose boundaries. Keep
    changes reviewable.
marketplaces:
  guild: acme-labs/guild
  partner-plugins: acme-labs/partner-plugins
  acme: acme-labs/acme-plugins
tools:
  search:
    command: uvx
    args:
      - search-mcp
    env:
      SEARCH_API_KEY: ${SEARCH_API_KEY}
    keySource: company
  docs:
    command: uvx
    args:
      - docs-mcp
    env: {}
    keySource: none
  tracker:
    kind: sse
    url: https://mcp.example.dev/sse
skills:
  audit: compliance@guild
  route: route@acme
  write: write@acme
  edit: edit@acme
  journal: journal@acme
purposes:
  - id: acme
    parent: null
    reason: shell — everyone lands here; routes to the purposes
    agent: core@acme
    decides: []
    owns: []
    reads: []
    skills:
      - route
    tools: []
  - id: growth
    parent: acme
    reason: attract, position and convert
    decides:
      - gtm
    owns:
      - kb-company
    reads: []
    skills: []
    tools: []
  - id: content
    parent: growth
    reason: position as an authority
    agent: content@acme
    decides:
      - editorial
    owns:
      - kb-content
    reads:
      - kb-company
      - kb-method
    skills:
      - write
      - edit
    tools:
      - search
      - docs
  - id: sales
    parent: growth
    reason: convert relationships into deals
    agent: sales-advisor@guild
    decides:
      - pricing
    owns:
      - proposals
    reads: []
    skills: []
    tools: []
  - id: services
    parent: acme
    reason: deliver value and keep clients successful
    decides:
      - allocation
    owns: []
    reads: []
    skills: []
    tools: []
  - id: success
    parent: services
    reason: client relationship and success
    agent: success@acme
    decides:
      - expectations
    owns:
      - clients
    reads: []
    skills: []
    tools: []
  - id: delivery
    parent: services
    reason: deliver the scope
    agent: delivery@acme
    decides:
      - scope
    owns:
      - kb-projects
    reads:
      - clients
      - kb-method
    skills: []
    tools:
      - tracker
  - id: method
    parent: acme
    reason: make the method explicit and alive
    agent: method@acme
    decides:
      - the-method
    owns:
      - kb-method
    reads: []
    skills: []
    tools: []
  - id: infra
    parent: acme
    reason: operate the tenant — workspace, db, governance
    agent: infra@acme
    decides:
      - architecture
    owns:
      - kb-infra
    reads: []
    skills:
      - audit
    tools: []
buckets:
  - id: kb-company
    backend: okf-repo
    repo: acme-labs/kb-company
    owner: growth
    sens: low
  - id: kb-content
    backend: okf-repo
    repo: acme-labs/kb-content
    owner: content
    sens: low
  - id: kb-method
    backend: okf-repo
    repo: acme-labs/kb-method
    owner: method
    sens: low
  - id: kb-projects
    backend: okf-repo
    repo: acme-labs/kb-projects
    owner: delivery
    sens: medium
  - id: kb-infra
    backend: okf-repo
    repo: acme-labs/kb-infra
    owner: infra
    sens: low
  - id: clients
    backend: surreal
    tables:
      - client
      - contact
    owner: success
    rowScope: account
    sens: high
  - id: proposals
    backend: surreal
    tables:
      - proposal
    owner: sales
    sens: high
users:
  - id: ada
    name: Ada
    github: ada-gh
    assignments:
      - purpose: acme
        role: owner
      - purpose: content
        role: owner
  - id: ben
    name: Ben
    github: ben-gh
    assignments:
      - purpose: content
        role: member
  - id: cleo
    name: Cleo
    github: cleo-gh
    assignments:
      - purpose: delivery
        scope: north
        role: member
